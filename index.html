<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32"
        href="./assets/images/favicon-32x32.png">

  <link rel="stylesheet" href="style.css">

  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;800&display=swap"
        rel="stylesheet">

  <title>Frontend Mentor | Blog preview card</title>
</head>

<body>
  <main>
    <article class="card">
      <img
        class="article-image"
        src="./assets/images/illustration-article.svg"
        alt=""
      >

      <div class="card-content">
        <p class="category">Learning</p>

        <p class="publish-date">
          Published <time datetime="2023-12-21">21 Dec 2023</time>
        </p>

        <h1>
          <a href="https://developer.mozilla.org/en-US/docs/Learn_web_development">
            HTML &amp; CSS foundations
          </a>
        </h1>

        <p class="description">
          These languages are the backbone of every website,
          defining structure, content, and presentation.
        </p>
      </div>

      <div class="author">
        <img
          src="./assets/images/image-avatar.webp"
          alt=""
          width="32"
          height="32"
        >
        <p>Greg Hooper</p>
      </div>
    </article>
  </main>

  <footer class="attribution">
    Challenge by
    <a href="https://www.frontendmentor.io?ref=challenge">
      Frontend Mentor</a>.
    Coded by
    <a href="https://github.com/Rusulalturfi">Rusul Al-Turfi</a>.
  </footer>
</body>
</html>
